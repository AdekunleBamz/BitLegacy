<svg width="980" height="220" viewBox="0 0 980 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BitLegacy Wordmark</title>
  <desc id="desc">BitLegacy brand wordmark with shield icon and modern typography.</desc>
  <defs>
    <linearGradient id="shieldGrad" x1="30" y1="10" x2="180" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD089"/>
      <stop offset="0.45" stop-color="#F7931A"/>
      <stop offset="1" stop-color="#C26A05"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="105" cy="100" r="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7931A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F7931A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(10, 8)">
    <!-- Outer glow behind shield -->
    <path d="M95 10L175 48V95C175 145 140 175 95 192C50 175 15 145 15 95V48L95 10Z" fill="url(#innerGlow)" filter="url(#glow)"/>

    <!-- Shield outline -->
    <path d="M95 16L170 52V95C170 142 137 171 95 187C53 171 20 142 20 95V52L95 16Z" fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round"/>

    <!-- Shield inner subtle fill -->
    <path d="M95 24L164 56V95C164 138 134 166 95 181C56 166 26 138 26 95V56L95 24Z" fill="#F7931A" fill-opacity="0.06"/>

    <!-- Bitcoin B -->
    <path d="M73 52H100C112 52 120 58 120 68C120 75 116 80 110 83C118 86 123 92 123 101C123 113 114 120 100 120H73V52ZM87 62V80H98C106 80 110 76 110 71C110 66 106 62 98 62H87ZM87 89V110H101C109 110 113 106 113 100C113 94 109 89 101 89H87Z" fill="url(#shieldGrad)"/>

    <!-- Vertical bars -->
    <rect x="91" y="45" width="4" height="82" rx="2" fill="#F5A63D" fill-opacity="0.9"/>
    <rect x="97" y="45" width="4" height="82" rx="2" fill="#F5A63D" fill-opacity="0.9"/>

    <!-- Infinity loop at shield base -->
    <path d="M75 145C75 145 85 137 95 137C105 137 115 145 115 145C115 145 105 153 95 153C85 153 75 145 75 145Z" stroke="url(#shieldGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Accent arcs -->
    <path d="M35 165C50 178 70 188 95 195" stroke="#F5BD68" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M155 30C140 20 120 12 95 6" stroke="#F5BD68" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Typography -->
  <text x="230" y="130" fill="#F6F6F6" font-size="92" font-weight="700" font-family="'Inter', 'SF Pro Display', 'Avenir Next', system-ui, sans-serif" letter-spacing="-2">Bit<tspan fill="#F7931A">Legacy</tspan></text>
  <text x="232" y="172" fill="#8A8A8A" font-size="22" font-weight="500" font-family="'Inter', 'SF Pro Display', 'Avenir Next', system-ui, sans-serif" letter-spacing="3.5">BITCOIN INHERITANCE PROTOCOL</text>
</svg>
